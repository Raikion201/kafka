plugins {
    id 'application'
}

description = 'Kafka Connect connector code generator from Airbyte manifests'

application {
    mainClass = 'org.apache.kafka.connect.manifest.codegen.ManifestCodegenCli'
}

// ── Source set for generated connector classes ─────────────────────────────────
// Drop a manifest into src/main/manifests/ and ./gradlew build will generate,
// compile, and package the corresponding connector classes automatically.

sourceSets {
    generated {
        java {
            srcDir layout.buildDirectory.dir('generated-sources/connectors')
        }
        // The CLI writes META-INF/services/... into generated-sources/connectors alongside
        // the .java files. Including it as a resources srcDir causes processGeneratedResources
        // to copy that file into the JAR so Kafka Connect's plugin scanner finds the connectors.
        resources {
            srcDir layout.buildDirectory.dir('generated-sources/connectors')
            exclude '**/*.java'
        }
    }
}

// ── Dependencies ──────────────────────────────────────────────────────────────

dependencies {
    // YAML parsing
    implementation libs.jacksonDataformatYaml
    implementation libs.jacksonDatabind

    // Java source code generation
    implementation libs.javapoet

    // Jinja2-compatible template engine. Used at codegen time (URL/header/query
    // interpolation) and at task runtime (per-record template rendering inside
    // generated source tasks). Replaces a hand-rolled Jinja runtime.
    implementation libs.jinjava
    generatedImplementation libs.jinjava

    // Logging
    implementation libs.slf4jApi

    // kafka-clients provides Exit, AbstractConfig, ConfigDef used in main + generated code compilation tests
    implementation project(':clients')
    // connect:api provides SourceConnector, SourceTask, Task, Schema, ConnectException — used by
    // the runtime/customs/* package (called from generated tasks at runtime) and by generated code itself
    implementation project(':connect:api')
    testImplementation project(':connect:api')

    testImplementation libs.junitJupiter
    testImplementation libs.mockitoCore
    testImplementation libs.jacksonDataformatYaml
    testRuntimeOnly runtimeTestLibs

    // Acceptance-test harness needs to reflectively instantiate generated SourceTask classes
    // (io.kafka.connect.generated.*SourceTask) and the codegen-time runtime helpers they depend on.
    testImplementation sourceSets.generated.output

    // Generated connector sources need AbstractConfig/ConfigDef (clients), SourceConnector/SourceTask (connect:api),
    // and Jackson (ObjectMapper used in poll() to parse HTTP responses)
    generatedImplementation project(':clients')
    generatedImplementation project(':connect:api')
    generatedImplementation libs.slf4jApi
    generatedImplementation libs.jacksonDatabind
    // Runtime helpers (JinjaRenderer, CustomComponentRegistry, custom-component impls) live in
    // the main source set and are referenced by the generated SourceTask classes.
    generatedImplementation sourceSets.main.output
}

// ── generateConnectors task ───────────────────────────────────────────────────

tasks.register('generateConnectors', JavaExec) {
    description = 'Generates Kafka Connect connector source files from all manifests in src/test/resources/manifests/'
    group = 'build'

    dependsOn compileJava   // generator classes must be compiled before we can invoke the CLI

    // Single source of truth: the full Airbyte manifest corpus lives in test resources.
    // src/main/manifests/ is kept for any hand-written overrides but is no longer the primary input.
    def manifestsDir = file('src/test/resources/manifests')
    def outputDir = layout.buildDirectory.dir('generated-sources/connectors')

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.apache.kafka.connect.manifest.codegen.ManifestCodegenCli'
    args = [manifestsDir.absolutePath, outputDir.get().asFile.absolutePath]

    inputs.dir(manifestsDir).optional()
    outputs.dir(outputDir)
}

compileGeneratedJava.dependsOn generateConnectors
processGeneratedResources.dependsOn generateConnectors

// ── Plugin fat-JAR ────────────────────────────────────────────────────────────
// Kafka Connect's PluginClassLoader loads every JAR in a plugin directory into
// a single classloader. The simplest reliable packaging is one fat JAR that
// bundles all runtime dependencies that the Connect runtime does NOT already
// provide (jackson-databind, kafka-clients, connect-api, slf4j are "provided").

configurations {
    // Runtime deps that need to travel with the plugin JAR (i.e. not provided by Connect)
    pluginRuntime {
        extendsFrom runtimeClasspath
        exclude group: 'org.apache.kafka'
        exclude group: 'org.slf4j'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.dataformat'
        exclude group: 'com.fasterxml.jackson.datatype'
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
}

jar {
    from sourceSets.generated.output

    // Bundle all pluginRuntime deps (jinjava + its transitive deps) so the plugin
    // is self-contained. Jackson and kafka classes are excluded above since
    // Connect already provides them, avoiding VerifyError classloader conflicts.
    from {
        configurations.pluginRuntime.resolvedConfiguration.resolvedArtifacts
            .findAll { it.moduleVersion.id.group != 'org.apache.kafka' }
            .collect { it.file.isDirectory() ? it.file : zipTree(it.file) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Generated code is not subject to style or static-analysis checks
checkstyleGenerated.enabled = false
spotbugsGenerated.enabled = false

// ── Checkstyle ────────────────────────────────────────────────────────────────

checkstyle {
    configProperties = checkstyleConfigProperties("import-control.xml")
}
