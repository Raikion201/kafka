version: "3.10.0"
type: DeclarativeSource

streams:
  # Stream 1: POST with flat static request_body_json, no pagination
  - type: DeclarativeStream
    name: post_static
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: /records
        http_method: POST
        authenticator:
          type: NoAuth
        request_body_json:
          query: "active"
          limit: "100"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results

  # Stream 2: POST with cursor paginator injecting page token into body_json
  - type: DeclarativeStream
    name: post_cursor_body
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: /paged
        http_method: POST
        authenticator:
          type: NoAuth
        request_body_json:
          pageSize: "50"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - data
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: body_json
          field_name: cursor
        page_size_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: page_size
        pagination_strategy:
          type: CursorPagination
          cursor_value: "{{ response.get('next_cursor', '') }}"
          stop_condition: "{{ response.get('next_cursor', '') == '' }}"

  # Stream 3: POST with raw request_body_data string
  - type: DeclarativeStream
    name: post_data
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: /form
        http_method: POST
        authenticator:
          type: NoAuth
        request_body_data: "format=json&version=2"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - items

spec:
  type: Spec
  connection_specification:
    $schema: "http://json-schema.org/draft-07/schema#"
    title: POST Body Test Source Spec
    type: object
    required:
      - server_url
    properties:
      server_url:
        type: string
        title: Mock Server URL
