version: "0.29.0"
type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - items_transformed

streams:
  - type: DeclarativeStream
    name: items_transformed
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: "/api/items"
        http_method: GET
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - items
    transformations:
      - type: CustomTransformation
        class_name: "test.UpperCaseNameTransformation"

  - type: DeclarativeStream
    name: items_extracted
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: "/api/raw"
        http_method: GET
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: CustomRecordExtractor
          class_name: "test.WrappedItemsExtractor"
          field_path: []

spec:
  type: Spec
  connection_specification:
    type: object
    required:
      - server_url
    properties:
      server_url:
        type: string
        description: Base URL of the test server
