version: 0.1.0
type: DeclarativeSource

description: >-
  Illumina BaseSpace connector. Lists projects accessible to the authenticated user
  using Bearer token auth against the BaseSpace v2 REST API.

check:
  type: CheckStream
  stream_names:
    - projects

streams:
  - type: DeclarativeStream
    name: projects
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.basespace.illumina.com/v2
        path: /projects
        http_method: GET
        authenticator:
          type: BearerAuthenticator
          api_token: "{{ config['access_token'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - items
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: offset
        page_size_option:
          type: RequestOption
          field_name: pageSize
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - access_token
    properties:
      access_token:
        type: string
        title: Access Token
        description: >-
          Bearer access token for the Illumina BaseSpace API.
          Generate one at https://developer.basespace.illumina.com/dashboard
        airbyte_secret: true
