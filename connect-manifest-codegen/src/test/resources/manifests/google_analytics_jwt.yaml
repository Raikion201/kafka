version: 0.1.0
type: DeclarativeSource

streams:
  - type: DeclarativeStream
    name: reports
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://analyticsreporting.googleapis.com/v4/
        path: reports
        http_method: GET
        authenticator:
          type: JwtAuthenticator
          secret_key: "{{ json_loads(config['credentials_json'])['private_key'] }}"
          algorithm: RS256
          token_duration: 3600
          header_prefix: Bearer
          jwt_payload:
            aud: "{{ json_loads(config['credentials_json'])['token_uri'] }}"
            iss: "{{ json_loads(config['credentials_json'])['client_email'] }}"
          additional_jwt_payload:
            scope: https://www.googleapis.com/auth/analytics.readonly
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - credentials_json
    properties:
      credentials_json:
        type: string
        title: Service Account JSON
        description: Contents of the Google Service Account JSON key file.
        airbyte_secret: true
