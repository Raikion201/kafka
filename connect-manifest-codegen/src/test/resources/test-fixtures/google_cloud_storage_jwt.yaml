version: 0.1.0
type: DeclarativeSource

description: >-
  Google Cloud Storage connector. Lists objects in a GCS bucket using
  a service account JSON key and JWT RS256 authentication.
  Permissions are set via Google Cloud IAM — no sharing dialog needed.

check:
  type: CheckStream
  stream_names:
    - objects

streams:
  - type: DeclarativeStream
    name: objects
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://storage.googleapis.com/storage/v1
        path: "/b/{{ config['bucket_name'] }}/o"
        http_method: GET
        authenticator:
          type: JwtAuthenticator
          secret_key: "{{ json_loads(config['credentials_json'])['private_key'] }}"
          algorithm: RS256
          token_duration: 3600
          header_prefix: Bearer
          jwt_payload:
            aud: "{{ json_loads(config['credentials_json'])['token_uri'] }}"
            iss: "{{ json_loads(config['credentials_json'])['client_email'] }}"
          additional_jwt_payload:
            scope: https://www.googleapis.com/auth/devstorage.read_only
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - items

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - credentials_json
      - bucket_name
    properties:
      credentials_json:
        type: string
        title: Service Account JSON
        description: Contents of the Google Service Account JSON key file.
        airbyte_secret: true
      bucket_name:
        type: string
        title: Bucket Name
        description: Name of the GCS bucket to list objects from.
