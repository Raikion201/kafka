version: "0.29.0"
type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - events_daily

streams:
  - type: DeclarativeStream
    name: events_daily
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: "/api/events"
        http_method: GET
        request_parameters:
          limit: "100"
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - items
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: created_at
      datetime_format: "%Y-%m-%dT%H:%M:%S"
      step: P1D
      cursor_granularity: PT1S
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date', '2020-01-01T00:00:00') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%S"
      start_time_option:
        type: RequestOption
        field_name: start
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: end
        inject_into: request_parameter

  - type: DeclarativeStream
    name: metrics_weekly
    primary_key: metric_id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: "/api/metrics"
        http_method: GET
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: ts
      datetime_format: "%Y-%m-%d"
      step: P1W
      cursor_granularity: PT1S
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date', '2020-01-01T00:00:00') }}"
        datetime_format: "%Y-%m-%d"
      start_time_option:
        type: RequestOption
        field_name: from_date
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: to_date
        inject_into: request_parameter

  - type: DeclarativeStream
    name: dynamic_step
    primary_key: id
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['server_url'] }}"
        path: "/api/dynamic"
        http_method: GET
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: updated_at
      datetime_format: "%Y-%m-%dT%H:%M:%S"
      step: "P{{ config.get('period_days', 30) }}D"
      cursor_granularity: PT1S
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config.get('start_date', '2020-01-01T00:00:00') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%S"
      start_time_option:
        type: RequestOption
        field_name: since
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: until
        inject_into: request_parameter

spec:
  type: Spec
  connection_specification:
    type: object
    required:
      - server_url
    properties:
      server_url:
        type: string
        description: Base URL of the test server
      start_date:
        type: string
        description: Start date for incremental sync (YYYY-MM-DDTHH:MM:SS)
      period_days:
        type: integer
        description: Number of days per window for dynamic_step stream
