version: "3.10.0"
type: DeclarativeSource

definitions:
  base_requester:
    type: HttpRequester
    url_base: "https://api.example.com/v1/"
    http_method: GET
    authenticator:
      type: ApiKeyAuthenticator
      api_token: "{{ config['api_key'] }}"
      inject_into:
        type: RequestOption
        field_name: X-API-Key
        inject_into: header

streams:
  - type: DeclarativeStream
    name: items
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: items
        http_method: GET
        request_parameters:
          category: "{{ stream_partition.category }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
      partition_router:
        type: ListPartitionRouter
        values:
          - electronics
          - clothing
          - books
        cursor_field: category
        request_option:
          type: RequestOption
          field_name: category
          inject_into: request_parameter

spec:
  type: Spec
  connection_specification:
    $schema: "http://json-schema.org/draft-07/schema#"
    title: Example Source Spec
    type: object
    required:
      - api_key
    properties:
      api_key:
        type: string
        title: API Key
        airbyte_secret: true
