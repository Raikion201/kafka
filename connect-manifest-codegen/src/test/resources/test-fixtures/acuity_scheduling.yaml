version: 0.1.0

type: DeclarativeSource

description: >-
  Acuity Scheduling connector test fixture. Tests BasicAuth + DatetimeBasedCursor
  with both start_time_option (minDate) and end_time_option (maxDate).

check:
  type: CheckStream
  stream_names:
    - appointments

definitions:
  base_requester:
    type: HttpRequester
    url_base: https://acuityscheduling.com/api/v1
    authenticator:
      type: BasicHttpAuthenticator
      username: "{{ config[\"username\"] }}"
      password: "{{ config[\"password\"] }}"

streams:
  - type: DeclarativeStream
    name: appointments
    primary_key:
      - id
    retriever:
      type: SimpleRetriever
      requester:
        $ref: "#/definitions/base_requester"
        path: appointments
        http_method: GET
        request_parameters:
          max: "100000"
          showall: "true"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []
    incremental_sync:
      type: DatetimeBasedCursor
      cursor_field: datetime
      cursor_datetime_formats:
        - "%Y-%m-%dT%H:%M:%S%z"
      datetime_format: "%Y-%m-%dT%H:%M:%S%z"
      start_datetime:
        type: MinMaxDatetime
        datetime: "{{ config[\"start_date\"] }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"
      start_time_option:
        type: RequestOption
        field_name: minDate
        inject_into: request_parameter
      end_time_option:
        type: RequestOption
        field_name: maxDate
        inject_into: request_parameter
      end_datetime:
        type: MinMaxDatetime
        datetime: "{{ now_utc().strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        datetime_format: "%Y-%m-%dT%H:%M:%SZ"

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - username
      - password
      - start_date
    properties:
      username:
        type: string
        title: User ID
        description: Your Acuity Scheduling user ID.
        order: 0
      password:
        type: string
        title: API Key
        description: Your Acuity Scheduling API key.
        airbyte_secret: true
        order: 1
      start_date:
        type: string
        title: Start Date
        description: Start date for incremental sync (ISO 8601).
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        order: 2
