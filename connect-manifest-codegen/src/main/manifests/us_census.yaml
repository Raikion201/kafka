version: 0.1.0
type: DeclarativeSource

streams:
  - type: DeclarativeStream
    name: population
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://api.census.gov/data/
        path: 2020/dec/pl
        http_method: GET
        authenticator:
          type: ApiKeyAuthenticator
          inject_into:
            type: RequestOption
            inject_into: request_parameter
            field_name: key
          api_token: "{{ config['api_key'] }}"
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - api_key
    properties:
      api_key:
        type: string
        title: API Key
        airbyte_secret: true
