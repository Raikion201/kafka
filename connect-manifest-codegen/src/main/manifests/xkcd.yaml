version: 0.1.0
type: DeclarativeSource

streams:
  - type: DeclarativeStream
    name: xkcd
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://xkcd.com
        path: "{{ config['comic_number'] }}/info.0.json"
        http_method: GET
        authenticator:
          type: NoAuth
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - comic_number
    properties:
      comic_number:
        type: string
        title: Comic Number
        description: The xkcd comic number to fetch (e.g. 614 for the "Woodpecker" comic)
        default: "614"
