version: 4.3.0
type: DeclarativeSource

description: >-
  Gmail connector - reads messages, threads, labels, and drafts from the
  Gmail API using OAuth 2.0.

check:
  type: CheckStream
  stream_names:
    - gmail

definitions:
  base_requester:
    type: HttpRequester
    url_base: https://gmail.googleapis.com/gmail/v1/users/me/
    authenticator:
      type: OAuthAuthenticator
      client_id: "{{ config['client_id'] }}"
      client_secret: "{{ config['client_secret'] }}"
      refresh_token: "{{ config['client_refresh_token'] }}"
      token_refresh_endpoint: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/gmail.readonly

  streams:
    gmail:
      type: DeclarativeStream
      name: gmail
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: profile
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path: []

    messages:
      type: DeclarativeStream
      name: messages
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: messages
          http_method: GET
          request_parameters:
            includeSpamTrash: "{{ config['include_spam_and_trash'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - messages

    messages_details:
      type: DeclarativeStream
      name: messages_details
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: messages
          http_method: GET
          request_parameters:
            format: full
            includeSpamTrash: "{{ config['include_spam_and_trash'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - messages

    threads:
      type: DeclarativeStream
      name: threads
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: threads
          http_method: GET
          request_parameters:
            includeSpamTrash: "{{ config['include_spam_and_trash'] }}"
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - threads

    threads_details:
      type: DeclarativeStream
      name: threads_details
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: threads
          http_method: GET
          request_parameters:
            format: full
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - threads

    labels:
      type: DeclarativeStream
      name: labels
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: labels
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - labels

    labels_details:
      type: DeclarativeStream
      name: labels_details
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: labels
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - labels

    drafts:
      type: DeclarativeStream
      name: drafts
      primary_key:
        - id
      retriever:
        type: SimpleRetriever
        requester:
          type: HttpRequester
          url_base: https://gmail.googleapis.com/gmail/v1/users/me/
          path: drafts
          http_method: GET
        record_selector:
          type: RecordSelector
          extractor:
            type: DpathExtractor
            field_path:
              - drafts

streams:
  - $ref: "#/definitions/streams/gmail"
  - $ref: "#/definitions/streams/messages"
  - $ref: "#/definitions/streams/messages_details"
  - $ref: "#/definitions/streams/threads"
  - $ref: "#/definitions/streams/threads_details"
  - $ref: "#/definitions/streams/labels"
  - $ref: "#/definitions/streams/labels_details"
  - $ref: "#/definitions/streams/drafts"

spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - client_id
      - client_secret
      - client_refresh_token
    properties:
      client_id:
        type: string
        title: Client ID
        description: >-
          Your Google OAuth 2.0 Client ID from the Google Cloud Console
          (APIs & Services > Credentials).
        order: 0
      client_secret:
        type: string
        title: Client Secret
        description: >-
          Your Google OAuth 2.0 Client Secret from the Google Cloud Console.
        airbyte_secret: true
        order: 1
      client_refresh_token:
        type: string
        title: Refresh Token
        description: >-
          Your Google OAuth 2.0 Refresh Token obtained after completing the
          OAuth authorization flow.
        airbyte_secret: true
        order: 2
      include_spam_and_trash:
        type: string
        title: Include Spam and Trash
        description: >-
          Set to "true" to include messages from SPAM and TRASH folders
          in message and thread streams. Defaults to "false".
        default: "false"
        order: 3
    additionalProperties: false

metadata:
  autoImportSchema:
    gmail: false
    messages: false
    messages_details: false
    threads: false
    threads_details: false
    labels: false
    labels_details: false
    drafts: false
