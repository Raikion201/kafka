version: 0.1.0
type: DeclarativeSource

streams:
  - type: DeclarativeStream
    name: cards
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: "{{ config['instance_api_url'] }}"
        path: card
        http_method: GET
        authenticator:
          type: LegacySessionTokenAuthenticator
          username: "{{ config['username'] }}"
          password: "{{ config['password'] }}"
          header: X-Metabase-Session
          session_token_response_key: id
          login_url: session
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: []

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - instance_api_url
      - username
      - password
    properties:
      instance_api_url:
        type: string
        title: Instance API URL
      username:
        type: string
        title: Username
      password:
        type: string
        title: Password
        airbyte_secret: true
