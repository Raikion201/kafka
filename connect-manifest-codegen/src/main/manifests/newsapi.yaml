version: 0.1.0

type: DeclarativeSource

description: >-
  NewsAPI connector. Fetches top US headlines using an API key injected
  into the X-Api-Key request header. Uses page-based pagination.
  Free API key at https://newsapi.org/register (no credit card required).

check:
  type: CheckStream
  stream_names:
    - articles

streams:
  - type: DeclarativeStream
    name: articles
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://newsapi.org/v2
        path: /top-headlines?country=us
        http_method: GET
        authenticator:
          type: ApiKeyAuthenticator
          api_token: "{{ config['api_key'] }}"
          inject_into:
            type: RequestOption
            field_name: X-Api-Key
            inject_into: header
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - articles
      paginator:
        type: DefaultPaginator
        page_token_option:
          type: RequestOption
          inject_into: request_parameter
          field_name: page
        page_size_option:
          type: RequestOption
          field_name: pageSize
          inject_into: request_parameter
        pagination_strategy:
          type: PageIncrement
          page_size: 20
          start_from_page: 1

spec:
  type: Spec
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required:
      - api_key
    properties:
      api_key:
        type: string
        description: >-
          NewsAPI.org API key. Get one free (no credit card) at
          https://newsapi.org/register
        airbyte_secret: true
